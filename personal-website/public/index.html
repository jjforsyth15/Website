<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta -->
    <title>Joseph Forsyth | Portfolio</title>
    <meta name="description" content="Portfolio of Joseph Forsyth — CS student at CSUN and aspiring full-stack engineer. Projects: ClassLink, ClasslyLinked, and more." />
    <meta name="author" content="Joseph Forsyth" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e2333" />
    <meta name="robots" content="index,follow" />

    <!-- Canonical (UPDATE to your live domain when deployed) -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Favicon / Icons -->
    <link rel="icon" href="%PUBLIC_URL%/JF_Logo2.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/JF_Logo2.jpg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <!-- UPDATE og:url to your live domain -->
    <meta property="og:url" content="https://jgforsyth.com/" />
    <meta property="og:title" content="Joseph Forsyth | Portfolio" />
    <meta property="og:description" content="CS @ CSUN • Full-stack projects in React, Flask, and Postgres/MongoDB. Check out ClassLink, ClasslyLinked, and more." />
    <!-- Place an image named og-image.jpg (1200×630 recommended) in /public -->
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:image:alt" content="Preview of Joseph Forsyth's portfolio website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- UPDATE to your domain -->
    <meta name="twitter:url" content="https://jgforsyth.com/" />
    <meta name="twitter:title" content="Joseph Forsyth | Portfolio" />
    <meta name="twitter:description" content="CS @ CSUN • Full-stack projects in React, Flask, and Postgres/MongoDB." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />

    <!-- Optional: JSON-LD structured data for richer previews -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Joseph Forsyth",
      "url": "https://your-domain.com/",
      "image": "%PUBLIC_URL%/og-image.jpg",
      "jobTitle": "Aspiring Full-Stack Engineer",
      "affiliation": "California State University, Northridge",
      "sameAs": [
        "https://www.linkedin.com/in/joseph-forsyth-467740247/",
        "https://github.com/jjforsyth15"
      ]
    }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
